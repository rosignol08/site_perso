<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#343541" media="(prefers-color-scheme: dark)">
    <title>YafoyeGPT</title>
    <link rel="stylesheet" href="style_chat.css?v=2.0.4"> <!-- augmenter la valeur à chaque update-->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div id="chat-container">
        
        <!-- Barre de titre avec gestion des conversations -->
        <div id="chat-header">
            <div id="header-controls">
                <button id="conversations-btn" onclick="toggleConversations()">💬 Conversations</button>
                <button id="model-toggle" class="model-toggle-btn">Modèle: gemma4:e2b</button>
                <button id="expert-toggle" class="model-toggle-btn expert-btn" title="Activer Qwen3.8 27B Turbo (Serveur Linux)">🚀 Expert</button>
            </div>
            <span id="current-conversation-title">Nouvelle conversation</span>
        </div>
        
        <!-- Liste des conversations (cachée par défaut) -->
        <div id="conversations-panel" class="hidden">
            <div class="conversations-header">
                <h3>Mes conversations</h3>
                <button onclick="createNewConversation()" class="new-conversation-btn">+ Nouvelle</button>
            </div>
            <div id="conversations-list"></div>
        </div>
        
        <div id="messages-box">
            <div class="message ai-message">
                <div class="message-content">
                    <div class="avatar">Y</div>
                    <div class="text">Bonjour, comment puis-je vous aider ?</div>
                </div>
            </div>
        </div>
        
        <div id="input-area">
            <div class="input-wrapper">
                <input type="text" id="user-input" placeholder="Envoyer un message..." autocomplete="off">
                <button id="send-button" onclick="sendMessage()" title="Envoyer le message" aria-label="Envoyer le message">Envoyer</button>
            </div>
            <p id="status-message"></p>
        </div>
    </div>

    <script src="script_chat.js?v=2.0.4"></script>
</body>
</html>
